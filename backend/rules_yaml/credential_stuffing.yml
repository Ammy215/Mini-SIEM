title: Credential Stuffing
rule_key: credential_stuffing
severity: high
mitre: T1110.004
description: 5 or more distinct usernames attempted from a single source IP within 10 minutes.
definition:
  version: 2
  filter: {field: action, op: eq, value: login_failed}
  aggregate:
    group_by: source_ip
    window_minutes: 10
    function: distinct
    distinct_field: username
    op: gte
    threshold: 5
  alert:
    signal: credential_stuffing
    title: "Credential stuffing from {source_ip}"
    count_key: distinct_usernames
    values_key: usernames
    values_field: username
