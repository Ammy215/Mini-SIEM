title: Password Spray
rule_key: password_spray
severity: high
mitre: T1110.003
description: One username targeted from 5 or more distinct source IPs within 10 minutes.
definition:
  version: 2
  filter: {field: action, op: eq, value: login_failed}
  aggregate:
    group_by: username
    window_minutes: 10
    function: distinct
    distinct_field: source_ip
    op: gte
    threshold: 5
  alert:
    signal: password_spray_confirmed
    title: "Password spray against user '{username}'"
    count_key: distinct_ips
    values_key: source_ips
    values_field: source_ip
