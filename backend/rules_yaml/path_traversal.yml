title: Path Traversal Attempt in HTTP Request
rule_key: path-traversal-001
severity: high
mitre: T1083
description: Detects directory traversal sequences and access to sensitive files like /etc/passwd.
definition:
  version: 2
  logsource: [nginx]
  filter:
    field: url
    op: contains_any
    value: ["../", "/etc/passwd"]
  alert:
    group_window_minutes: 60
    signal: path_traversal
