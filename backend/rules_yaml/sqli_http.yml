title: SQL Injection Attempt in HTTP Request
rule_key: sqli-http-001
rule_type: signature
severity: high
mitre: T1190
description: >-
  Detects SQL injection payload shapes in the decoded request URL. Matches on
  SQL structure (UNION SELECT, tautologies, schema probing, time-based delays)
  rather than bare comment markers - a lone "--" matched any URL containing a
  double hyphen, which is far too loose to be a signal on its own.
logsource: nginx
detection:
  field: url
  contains:
    - "UNION SELECT"
    - "UNION ALL SELECT"
    - "' OR 1=1"
    - "' OR '1'='1"
    - "\" OR 1=1"
    - "OR 1=1"
    - "' AND '1'='1"
    - "'--"
    - "' #"
    - "information_schema"
    - "SLEEP("
    - "WAITFOR DELAY"
    - "BENCHMARK("
    - "xp_cmdshell"
  condition: any
  signal: sqli_pattern
