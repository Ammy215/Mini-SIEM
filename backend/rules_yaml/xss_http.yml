title: Cross-Site Scripting (XSS) Attempt in HTTP Request
rule_key: xss-http-001
severity: medium
mitre: T1059.007
description: Detects <script> tags and onerror= handlers in the request URL/query string.
definition:
  version: 2
  logsource: [nginx]
  filter:
    field: url
    op: contains_any
    value: ["<script>", "onerror="]
  alert:
    group_window_minutes: 60
    signal: xss_pattern
